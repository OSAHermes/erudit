<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erudit - 个人知识库</title>
    <style>
        /* ========== 浅色主题 ========== */
        :root[data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-sidebar: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8888aa;
            --border-color: #e0e0e8;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-glow: 0 4px 20px rgba(102, 126, 234, 0.3);
            --hover-bg: rgba(102, 126, 234, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.12);
            --code-bg: #f5f5f7;
            --tag-bg: rgba(102, 126, 234, 0.1);
            --tag-text: #667eea;
        }

        /* ========== 深色主题 ========== */
        :root[data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-sidebar: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #b1bac4;
            --text-muted: #6e7681;
            --border-color: #30363d;
            --accent-primary: #7c8aff;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #7c8aff 0%, #a855f7 100%);
            --accent-glow: 0 4px 20px rgba(124, 138, 255, 0.4);
            --hover-bg: rgba(124, 138, 255, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
            --code-bg: #1a1f26;
            --tag-bg: rgba(124, 138, 255, 0.15);
            --tag-text: #7c8aff;
        }

        /* ========== 赛博朋克主题 ========== */
        :root[data-theme="cyberpunk"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-sidebar: #0d0d15;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0cc;
            --text-muted: #5a5a8a;
            --border-color: #1a1a3a;
            --accent-primary: #00f0ff;
            --accent-secondary: #ff00aa;
            --accent-gradient: linear-gradient(135deg, #00f0ff 0%, #0080ff 50%, #ff00aa 100%);
            --accent-glow: 0 0 20px rgba(0, 240, 255, 0.5);
            --accent-glow-strong: 0 0 30px rgba(0, 240, 255, 0.8), 0 0 60px rgba(0, 240, 255, 0.4);
            --hover-bg: rgba(0, 240, 255, 0.1);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 240, 255, 0.1);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.2);
            --code-bg: #0a0a15;
            --tag-bg: rgba(0, 240, 255, 0.15);
            --tag-text: #00f0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        [data-theme="cyberpunk"] body {
            background: var(--bg-primary);
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 240, 255, 0.02) 2px, rgba(0, 240, 255, 0.02) 4px),
                linear-gradient(180deg, rgba(0, 240, 255, 0.02) 0%, transparent 50%, rgba(255, 0, 170, 0.02) 100%);
        }

        /* ========== 页头 ========== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s;
        }

        [data-theme="cyberpunk"] .header {
            background: linear-gradient(180deg, #0a0a15 0%, #12121a 100%);
            border-bottom: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow);
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        [data-theme="cyberpunk"] .navbar-brand {
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: var(--accent-glow);
        }

        .navbar-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .nav-btn.primary {
            background: var(--accent-gradient);
            color: white;
        }

        .nav-btn.primary:hover {
            opacity: 0.9;
            box-shadow: var(--accent-glow);
        }

        /* ========== 主体布局 ========== */
        .main {
            display: flex;
            min-height: calc(100vh - 64px);
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            overflow-y: auto;
            transition: all 0.3s;
        }

        [data-theme="cyberpunk"] .sidebar {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            box-shadow: inset -1px 0 20px rgba(0, 240, 255, 0.05);
        }

        .stats-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-primary);
        }

        [data-theme="cyberpunk"] .stat-number {
            text-shadow: var(--accent-glow);
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 12px 8px;
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .article-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .article-item:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .article-item.active {
            background: var(--hover-bg);
            color: var(--accent-primary);
            font-weight: 600;
        }

        [data-theme="cyberpunk"] .article-item {
            border-left: 2px solid transparent;
        }

        [data-theme="cyberpunk"] .article-item:hover,
        [data-theme="cyberpunk"] .article-item.active {
            border-left-color: var(--accent-primary);
            background: var(--hover-bg);
        }

        .article-title {
            font-size: 14px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .article-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ========== 内容区 ========== */
        .content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .login-card {
            max-width: 400px;
            margin: 60px auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }

        [data-theme="cyberpunk"] .login-card {
            border: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow-strong);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background: var(--accent-gradient);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }

        .article-view {
            max-width: 800px;
        }

        .article-header {
            margin-bottom: 32px;
        }

        .article-title-main {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .article-meta {
            display: flex;
            gap: 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .article-content {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .article-content h1, .article-content h2, .article-content h3 {
            margin: 32px 0 16px;
            color: var(--text-primary);
        }

        .article-content p {
            margin-bottom: 16px;
        }

        .article-content code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 14px;
        }

        .article-content pre {
            background: var(--code-bg);
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
        }

        .article-content pre code {
            background: none;
            padding: 0;
        }

        .article-content blockquote {
            border-left: 4px solid var(--accent-primary);
            padding-left: 20px;
            margin: 16px 0;
            color: var(--text-muted);
        }

        .article-content img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
        }

        .article-content a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        .article-content a:hover {
            text-decoration: underline;
        }

        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }

        .article-content th, .article-content td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }

        .article-content th {
            background: var(--code-bg);
            font-weight: 600;
        }

        .article-content ul, .article-content ol {
            padding-left: 24px;
            margin: 16px 0;
        }

        .article-content li {
            margin: 8px 0;
        }

        /* ========== 右下角管理面板 ========== */
        .admin-panel {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }

        .admin-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--accent-glow-strong);
            transition: all 0.3s;
            color: white;
            font-size: 24px;
        }

        .admin-toggle:hover {
            transform: scale(1.1);
        }

        .admin-toggle.active {
            transform: rotate(45deg);
        }

        [data-theme="cyberpunk"] .admin-toggle {
            box-shadow: var(--accent-glow-strong);
            border: 1px solid var(--accent-primary);
        }

        .admin-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            min-width: 280px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s;
        }

        .admin-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        [data-theme="cyberpunk"] .admin-menu {
            border: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow-strong);
        }

        .menu-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .menu-item:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .menu-item-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--code-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .menu-item-content {
            flex: 1;
        }

        .menu-item-title {
            font-size: 14px;
            font-weight: 500;
        }

        .menu-item-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ========== 主题选择器 ========== */
        .theme-selector {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--code-bg);
            border-radius: 8px;
            margin-top: 8px;
        }

        .theme-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .theme-btn:hover, .theme-btn.active {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        [data-theme="cyberpunk"] .theme-btn.active {
            border-color: var(--accent-primary);
            box-shadow: var(--accent-glow);
        }

        /* ========== 登录弹窗 ========== */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .login-modal.show {
            opacity: 1;
            visibility: visible;
        }

        [data-theme="cyberpunk"] .login-modal {
            background: rgba(0, 0, 0, 0.8);
        }

        .login-modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 400px;
            transform: scale(0.9);
            transition: all 0.3s;
        }

        .login-modal.show .login-modal-content {
            transform: scale(1);
        }

        [data-theme="cyberpunk"] .login-modal-content {
            border: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow-strong);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--code-bg);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        /* ========== 页脚 ========== */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 24px 32px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            transition: all 0.3s;
        }

        [data-theme="cyberpunk"] .footer {
            background: linear-gradient(180deg, #12121a 0%, #0a0a0f 100%);
            border-top: 1px solid var(--border-color);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 12px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent-primary);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .content {
                padding: 16px;
            }

            .article-title-main {
                font-size: 24px;
            }

            .admin-panel {
                bottom: 16px;
                right: 16px;
            }

            .admin-menu {
                right: -8px;
                min-width: 260px;
            }
        }

        /* ========== 加载动画 ========== */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
    </style>
</head>
<body>
    <!-- 页头 -->
    <header class="header">
        <div class="navbar-brand">📚 Erudit</div>
        <nav class="navbar-nav">
            <button class="nav-btn" onclick="showSearch()">🔍 搜索</button>
            <button class="nav-btn" onclick="showRSS()">📡 RSS</button>
            <a href="/docs" class="nav-btn">📖 API</a>
        </nav>
    </header>

    <!-- 主体 -->
    <div class="main">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <!-- 统计面板 -->
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">文章数</span>
                    <span class="stat-number" id="stat-articles">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">分类数</span>
                    <span class="stat-number" id="stat-categories">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">标签数</span>
                    <span class="stat-number" id="stat-tags">0</span>
                </div>
            </div>

            <!-- 文章列表 -->
            <div class="section-title">文章列表</div>
            <div class="article-list" id="article-list">
                <div class="loading">加载中</div>
            </div>
        </aside>

        <!-- 内容区 -->
        <main class="content" id="content">
            <div class="loading">加载中</div>
        </main>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-links">
            <a href="/">首页</a>
            <a href="/docs">API 文档</a>
            <a href="https://github.com/trencps/erudit" target="_blank">GitHub</a>
        </div>
        <div>© 2026 Erudit - 个人知识管理系统</div>
    </footer>

    <!-- 右下角管理面板 -->
    <div class="admin-panel">
        <div class="admin-menu" id="admin-menu">
            <div class="menu-title">管理面板</div>
            
            <!-- 主题切换 -->
            <div class="menu-item" onclick="toggleThemeMenu()">
                <div class="menu-item-icon">🎨</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">主题切换</div>
                    <div class="menu-item-desc">切换界面主题</div>
                </div>
            </div>
            <div class="theme-selector" id="theme-selector" style="display: none;">
                <button class="theme-btn active" data-theme="light" onclick="setTheme('light')">☀️ 浅色</button>
                <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">🌙 深色</button>
                <button class="theme-btn" data-theme="cyberpunk" onclick="setTheme('cyberpunk')">💜 赛博</button>
            </div>

            <!-- 后台登录 -->
            <div class="menu-item" onclick="showLoginModal()">
                <div class="menu-item-icon">🔐</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">后台登录</div>
                    <div class="menu-item-desc">管理员登录</div>
                </div>
            </div>

            <!-- API 文档 -->
            <div class="menu-item" onclick="window.open('/docs', '_blank')">
                <div class="menu-item-icon">📖</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">API 文档</div>
                    <div class="menu-item-desc">接口文档</div>
                </div>
            </div>

            <!-- RSS 订阅 -->
            <div class="menu-item" onclick="showRSS()">
                <div class="menu-item-icon">📡</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">RSS 订阅</div>
                    <div class="menu-item-desc">订阅最新文章</div>
                </div>
            </div>

            <!-- GitHub -->
            <div class="menu-item" onclick="window.open('https://github.com/trencps/erudit', '_blank')">
                <div class="menu-item-icon">⭐</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">GitHub</div>
                    <div class="menu-item-desc">查看源码</div>
                </div>
            </div>
        </div>
        <button class="admin-toggle" id="admin-toggle" onclick="toggleAdminMenu()">⚙️</button>
    </div>

    <!-- 登录弹窗 -->
    <div class="login-modal" id="login-modal">
        <div class="login-modal-content">
            <div class="modal-header">
                <div class="modal-title">后台登录</div>
                <button class="modal-close" onclick="closeLoginModal()">×</button>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="login-password" placeholder="请输入管理密码">
            </div>
            <button class="btn" onclick="doLogin()">登录</button>
            <div class="error-msg" id="login-error"></div>
        </div>
    </div>

    <script>
        let currentArticle = null;
        let token = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadArticles();
            loadTheme();
            
            // 点击外部关闭菜单
            document.addEventListener('click', (e) => {
                const panel = document.querySelector('.admin-panel');
                if (!panel.contains(e.target)) {
                    document.getElementById('admin-menu').classList.remove('show');
                    document.getElementById('admin-toggle').classList.remove('active');
                }
            });
        });

        // 加载统计
        async function loadStats() {
            try {
                const res = await fetch('/stats');
                const data = await res.json();
                document.getElementById('stat-articles').textContent = data.articles || 0;
                document.getElementById('stat-categories').textContent = data.categories || 0;
                document.getElementById('stat-tags').textContent = data.tags || 0;
            } catch (e) {
                console.error('加载统计失败:', e);
            }
        }

        // 加载文章列表
        async function loadArticles() {
            try {
                const res = await fetch('/articles');
                const data = await res.json();
                console.log('Articles response:', data);
                const list = document.getElementById('article-list');
                
                if (data.articles && data.articles.length > 0) {
                    list.innerHTML = data.articles.map(a => `
                        <div class="article-item" onclick="showArticle('${a.slug}')">
                            <div class="article-title">${a.title}</div>
                            <div class="article-meta">${a.created_at || '未知时间'}</div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="loading">暂无文章</div>';
                }
            } catch (e) {
                console.error('Load articles error:', e);
                document.getElementById('article-list').innerHTML = '<div class="loading">加载失败</div>';
            }
        }

        // 显示文章
        async function showArticle(slug) {
            try {
                const res = await fetch(`/articles/${slug}`);
                const data = await res.json();
                console.log('Article data:', data);
                currentArticle = data;
                
                // 高亮当前文章
                document.querySelectorAll('.article-item').forEach(el => {
                    el.classList.remove('active');
                    if (el.onclick && el.onclick.toString().includes(slug)) {
                        el.classList.add('active');
                    }
                });
                
                // 渲染内容
                const content = data.content || '';
                document.getElementById('content').innerHTML = `
                    <div class="article-view">
                        <div class="article-header">
                            <h1 class="article-title-main">${data.title}</h1>
                            <div class="article-meta">
                                <span>📅 ${data.created_at || '未知'}</span>
                                ${data.category ? `<span>📁 ${data.category}</span>` : ''}
                                ${data.tags ? `<span>🏷️ ${typeof data.tags === 'string' ? data.tags : data.tags.join(', ')}</span>` : ''}
                            </div>
                        </div>
                        <div class="article-content">${markdownToHtml(content)}</div>
                    </div>
                `;
            } catch (e) {
                console.error('Show article error:', e);
                document.getElementById('content').innerHTML = '<div class="loading">加载失败</div>';
            }
        }

        // 简单的 Markdown 转 HTML
        function markdownToHtml(md) {
            if (!md) return '';
            return md
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\*(.*)\*/gim, '<em>$1</em>')
                .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/gim, '<code>$1</code>')
                .replace(/\n/gim, '<br />');
        }

        // 搜索
        function showSearch() {
            const keyword = prompt('请输入搜索关键词:');
            if (keyword) {
                window.location.href = `/search?keyword=${encodeURIComponent(keyword)}`;
            }
        }

        // RSS
        function showRSS() {
            window.open('/rss', '_blank');
        }

        // 管理面板切换
        function toggleAdminMenu() {
            const menu = document.getElementById('admin-menu');
            const toggle = document.getElementById('admin-toggle');
            menu.classList.toggle('show');
            toggle.classList.toggle('active');
        }

        // 主题菜单切换
        function toggleThemeMenu() {
            const selector = document.getElementById('theme-selector');
            selector.style.display = selector.style.display === 'none' ? 'flex' : 'none';
        }

        // 设置主题
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('erudit-theme', theme);
            
            // 更新按钮状态
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        // 加载主题
        function loadTheme() {
            const saved = localStorage.getItem('erudit-theme') || 'light';
            setTheme(saved);
        }

        // 登录弹窗
        function showLoginModal() {
            document.getElementById('login-modal').classList.add('show');
            document.getElementById('login-password').focus();
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.remove('show');
            document.getElementById('login-password').value = '';
            document.getElementById('login-error').textContent = '';
        }

        // 登录
        async function doLogin() {
            const password = document.getElementById('login-password').value;
            if (!password) {
                document.getElementById('login-error').textContent = '请输入密码';
                return;
            }
            
            try {
                const res = await fetch(`/api/auth/login?password=${encodeURIComponent(password)}`);
                const data = await res.json();
                
                if (data.token) {
                    token = data.token;
                    localStorage.setItem('erudit-token', token);
                    closeLoginModal();
                    alert('登录成功！');
                    window.location.href = '/admin';
                } else {
                    document.getElementById('login-error').textContent = '密码错误';
                }
            } catch (e) {
                document.getElementById('login-error').textContent = '登录失败，请重试';
            }
        }

        // 回车登录
        document.getElementById('login-password')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
