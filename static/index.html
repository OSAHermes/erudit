<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erudit - 个人知识库</title>
    <style>
        /* ========== 主题变量 ========== */
        /* ========== 梦幻浅色主题 ========== */
        :root[data-theme="light"] {
            --bg-primary: #faf5ff;
            --bg-secondary: #ffffff;
            --bg-sidebar: #f8f0ff;
            --text-primary: #2d1b4e;
            --text-secondary: #5a4575;
            --text-muted: #9a85b5;
            --border-color: #e8dff5;
            --accent-primary: #a855f7;
            --accent-secondary: #ec4899;
            --accent-gradient: linear-gradient(135deg, #c084fc 0%, #a855f7 25%, #ec4899 50%, #f472b6 75%, #fb7185 100%);
            --accent-glow: 0 0 20px rgba(168, 85, 247, 0.3);
            --accent-glow-strong: 0 0 30px rgba(168, 85, 247, 0.5), 0 0 60px rgba(236, 72, 153, 0.3);
            --hover-bg: rgba(168, 85, 247, 0.05);
            --shadow-sm: 0 2px 12px rgba(168, 85, 247, 0.08);
            --shadow-md: 0 4px 24px rgba(168, 85, 247, 0.12), 0 2px 8px rgba(236, 72, 153, 0.06);
            --shadow-lg: 0 10px 40px rgba(168, 85, 247, 0.15), 0 4px 16px rgba(236, 72, 153, 0.08);
            --code-bg: #f5f0ff;
            --tag-bg: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(236, 72, 153, 0.1));
            --tag-text: #9333ea;
            --card-gradient: linear-gradient(135deg, rgba(192, 132, 252, 0.05) 0%, rgba(244, 114, 182, 0.05) 100%);
            --blur-bg: blur(20px);
        }

        [data-theme="light"] body {
            background: linear-gradient(135deg, #faf5ff 0%, #fff0f5 50%, #f0f5ff 100%);
            background-attachment: fixed;
            position: relative;
        }

        [data-theme="light"] body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(192, 132, 252, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(251, 191, 36, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        [data-theme="light"] .header {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.15) 0%, rgba(236, 72, 153, 0.15) 100%);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        [data-theme="light"] .navbar-brand {
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.4));
        }

        [data-theme="light"] .navbar-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #7c3aed;
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .navbar-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #a855f7;
            box-shadow: var(--accent-glow);
            transform: translateY(-2px);
        }

        [data-theme="light"] .navbar-btn.primary {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: none;
            font-weight: 600;
            box-shadow: var(--accent-glow);
        }

        [data-theme="light"] .navbar-btn.primary:hover {
            box-shadow: var(--accent-glow-strong);
            transform: translateY(-2px);
        }

        [data-theme="light"] .sidebar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border: 1px solid rgba(168, 85, 247, 0.15);
            box-shadow: var(--shadow-md);
        }

        [data-theme="light"] .stat-item {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.2) 0%, rgba(236, 72, 153, 0.2) 100%);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: var(--shadow-sm);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
        }

        [data-theme="light"] .stat-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        [data-theme="light"] .stat-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        [data-theme="light"] .article-item {
            border: 1px solid rgba(168, 85, 247, 0.1);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .article-item:hover {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: var(--shadow-md);
            transform: translateX(4px);
        }

        [data-theme="light"] .article-item.active {
            background: linear-gradient(90deg, rgba(192, 132, 252, 0.15) 0%, rgba(236, 72, 153, 0.15) 100%);
            border-color: #a855f7;
            box-shadow: var(--accent-glow);
        }

        [data-theme="light"] .content-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border: 1px solid rgba(168, 85, 247, 0.15);
            box-shadow: var(--shadow-lg);
        }

        [data-theme="light"] .form-input,
        [data-theme="light"] .editor-input,
        [data-theme="light"] .editor-select,
        [data-theme="light"] .editor-textarea {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: var(--text-primary);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
        }

        [data-theme="light"] .form-input:focus,
        [data-theme="light"] .editor-input:focus,
        [data-theme="light"] .editor-select:focus,
        [data-theme="light"] .editor-textarea:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1), var(--accent-glow);
            outline: none;
            background: rgba(255, 255, 255, 0.9);
        }

        [data-theme="light"] .btn {
            background: linear-gradient(135deg, #c084fc, #ec4899);
            border: none;
            color: white;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .btn:hover {
            box-shadow: var(--accent-glow-strong);
            transform: translateY(-2px);
        }

        [data-theme="light"] .btn-danger {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
        }

        [data-theme="light"] .btn-danger:hover {
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.5);
        }

        [data-theme="light"] .tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid rgba(168, 85, 247, 0.2);
            font-size: 0.75rem;
        }

        [data-theme="light"] .login-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: var(--shadow-lg), var(--accent-glow);
        }

        [data-theme="light"] .theme-toggle {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        [data-theme="light"] .theme-toggle::before {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        [data-theme="light"] .footer {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
        }

        [data-theme="light"] .empty-state-icon {
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        [data-theme="light"] ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        [data-theme="light"] ::-webkit-scrollbar-track {
            background: rgba(168, 85, 247, 0.05);
        }

        [data-theme="light"] ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #c084fc, #ec4899);
            border-radius: 4px;
        }

        [data-theme="light"] ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #a855f7, #db2777);
        }

        [data-theme="light"] ::selection {
            background: rgba(168, 85, 247, 0.2);
            color: #7c3aed;
        }


        :root[data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-sidebar: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #b1bac4;
            --text-muted: #6e7681;
            --border-color: #30363d;
            --accent-primary: #7c8aff;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #7c8aff 0%, #a855f7 100%);
            --hover-bg: #1f2937;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.5);
            --code-bg: #1f2937;
            --tag-bg: #1e3a5f;
            --tag-text: #79c0ff;
        }

        /* ========== 赛博朋克主题 ========== */
        :root[data-theme="cyberpunk"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-sidebar: #0d0d15;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0cc;
            --text-muted: #5a5a8a;
            --border-color: #1a1a3a;
            --accent-primary: #00f0ff;
            --accent-secondary: #ff00aa;
            --accent-gradient: linear-gradient(135deg, #00f0ff 0%, #0080ff 50%, #ff00aa 100%);
            --accent-glow: 0 0 20px rgba(0, 240, 255, 0.5);
            --accent-glow-strong: 0 0 30px rgba(0, 240, 255, 0.8), 0 0 60px rgba(0, 240, 255, 0.4);
            --hover-bg: rgba(0, 240, 255, 0.1);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 240, 255, 0.1);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.2);
            --code-bg: #0a0a15;
            --tag-bg: rgba(0, 240, 255, 0.15);
            --tag-text: #00f0ff;
        }

        [data-theme="cyberpunk"] body {
            background: var(--bg-primary);
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 240, 255, 0.02) 2px, rgba(0, 240, 255, 0.02) 4px),
                linear-gradient(180deg, rgba(0, 240, 255, 0.02) 0%, transparent 50%, rgba(255, 0, 170, 0.02) 100%);
        }

        [data-theme="cyberpunk"] .header {
            background: linear-gradient(180deg, #0a0a15 0%, #12121a 100%);
            border-bottom: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow);
        }

        [data-theme="cyberpunk"] .navbar-brand {
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: var(--accent-glow);
        }

        [data-theme="cyberpunk"] .navbar-btn {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }

        [data-theme="cyberpunk"] .navbar-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: var(--accent-glow);
        }

        [data-theme="cyberpunk"] .navbar-btn.primary {
            background: var(--accent-primary);
            color: #0a0a0f;
            font-weight: 700;
        }

        [data-theme="cyberpunk"] .sidebar {
            border-left: 2px solid var(--accent-primary);
            box-shadow: var(--shadow-md);
        }

        [data-theme="cyberpunk"] .stat-item {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1) 0%, rgba(10, 10, 15, 0.9) 50%, rgba(255, 0, 170, 0.1) 100%);
            border: 1px solid var(--accent-primary);
        }

        [data-theme="cyberpunk"] .stat-number {
            font-family: 'Courier New', monospace;
            color: var(--accent-primary);
            text-shadow: var(--accent-glow);
        }

        [data-theme="cyberpunk"] .article-item {
            border-color: var(--border-color);
        }

        [data-theme="cyberpunk"] .article-item:hover,
        [data-theme="cyberpunk"] .article-item.active {
            border-color: var(--accent-primary);
            background: var(--hover-bg);
        }

        [data-theme="cyberpunk"] .form-input,
        [data-theme="cyberpunk"] .editor-input,
        [data-theme="cyberpunk"] .editor-textarea {
            background: var(--code-bg);
            border-color: var(--border-color);
            font-family: 'Courier New', monospace;
        }

        [data-theme="cyberpunk"] .form-input:focus,
        [data-theme="cyberpunk"] .editor-input:focus,
        [data-theme="cyberpunk"] .editor-textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        [data-theme="cyberpunk"] .btn {
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }

        [data-theme="cyberpunk"] .btn-primary {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        [data-theme="cyberpunk"] .btn-primary:hover {
            background: var(--accent-primary);
            color: #0a0a0f;
            box-shadow: var(--accent-glow-strong);
        }

        [data-theme="cyberpunk"] .login-card {
            border: 1px solid var(--accent-primary);
            box-shadow: var(--shadow-lg), var(--accent-glow);
        }

        [data-theme="cyberpunk"] .theme-toggle {
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid var(--accent-primary);
        }

        [data-theme="cyberpunk"] .theme-toggle::before {
            background: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        [data-theme="cyberpunk"] ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
        }

        
        /* ========== 霓虹东京主题 ========== */
        :root[data-theme="neontokyo"] {
            --bg-primary: #0f0515;
            --bg-secondary: #1a0a25;
            --bg-sidebar: #150820;
            --text-primary: #f0d0ff;
            --text-secondary: #c8a0e0;
            --text-muted: #6a4a8a;
            --border-color: #2a1545;
            --accent-primary: #ff6ec7;
            --accent-secondary: #7b68ee;
            --accent-gradient: linear-gradient(135deg, #ff6ec7 0%, #9d7fff 50%, #7b68ee 100%);
            --accent-glow: 0 0 25px rgba(255, 110, 199, 0.6);
            --accent-glow-strong: 0 0 40px rgba(255, 110, 199, 0.9), 0 0 80px rgba(123, 104, 238, 0.4);
            --hover-bg: rgba(255, 110, 199, 0.1);
            --shadow-sm: 0 2px 15px rgba(255, 110, 199, 0.2);
            --shadow-md: 0 4px 25px rgba(123, 104, 238, 0.3), 0 0 20px rgba(255, 110, 199, 0.1);
            --shadow-lg: 0 10px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 110, 199, 0.25);
            --code-bg: #120818;
            --tag-bg: rgba(255, 110, 199, 0.15);
            --tag-text: #ff9ed9;
            --pink-glow: 0 0 20px rgba(255, 110, 199, 0.5);
            --purple-glow: 0 0 20px rgba(123, 104, 238, 0.5);
        }

        [data-theme="neontokyo"] body {
            background: var(--bg-primary);
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 110, 199, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(123, 104, 238, 0.08) 0%, transparent 50%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 50px,
                    rgba(255, 110, 199, 0.02) 50px,
                    rgba(255, 110, 199, 0.02) 51px
                );
        }

        [data-theme="neontokyo"] .header {
            background: linear-gradient(180deg, #150820 0%, #1a0a25 100%);
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, #ff6ec7, #7b68ee) 1;
            box-shadow: 0 5px 30px rgba(255, 110, 199, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
        }

        [data-theme="neontokyo"] .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff6ec7, #7b68ee, #ff6ec7, transparent);
            animation: neonFlow 4s linear infinite;
        }

        [data-theme="neontokyo"] .navbar-brand {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff6ec7, #ffd700, #7b68ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(255, 110, 199, 0.5));
        }

        [data-theme="neontokyo"] .navbar-btn {
            background: rgba(255, 110, 199, 0.08);
            border: 1px solid rgba(255, 110, 199, 0.4);
            color: #ff9ed9;
            font-weight: 500;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        [data-theme="neontokyo"] .navbar-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        [data-theme="neontokyo"] .navbar-btn:hover::before {
            left: 100%;
        }

        [data-theme="neontokyo"] .navbar-btn:hover {
            background: rgba(255, 110, 199, 0.2);
            border-color: #ff6ec7;
            box-shadow: var(--accent-glow);
            color: #fff;
        }

        [data-theme="neontokyo"] .navbar-btn.primary {
            background: linear-gradient(135deg, #ff6ec7, #9d7fff);
            color: #fff;
            border: none;
            font-weight: 600;
            box-shadow: var(--purple-glow);
        }

        [data-theme="neontokyo"] .navbar-btn.primary:hover {
            box-shadow: var(--accent-glow-strong);
            transform: translateY(-2px);
        }

        [data-theme="neontokyo"] .sidebar {
            background: linear-gradient(180deg, #150820 0%, #1a0a25 100%);
            border: 1px solid var(--border-color);
            border-left: 3px solid #ff6ec7;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        [data-theme="neontokyo"] .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #ff6ec7, #7b68ee, #ff6ec7);
        }

        [data-theme="neontokyo"] .stat-item {
            background: linear-gradient(135deg, 
                rgba(255, 110, 199, 0.15) 0%, 
                rgba(26, 10, 37, 0.95) 50%,
                rgba(123, 104, 238, 0.15) 100%
            );
            border: 1px solid rgba(255, 110, 199, 0.4);
            box-shadow: var(--shadow-sm), inset 0 0 30px rgba(255, 110, 199, 0.05);
            position: relative;
            overflow: hidden;
        }

        [data-theme="neontokyo"] .stat-item::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent,
                rgba(255, 110, 199, 0.1),
                transparent,
                rgba(123, 104, 238, 0.1),
                transparent
            );
            animation: hologramSpin 6s linear infinite;
        }

        [data-theme="neontokyo"] .stat-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ff6ec7, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 8px rgba(255, 110, 199, 0.6));
            position: relative;
            z-index: 1;
        }

        [data-theme="neontokyo"] .stat-label {
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            position: relative;
            z-index: 1;
        }

        [data-theme="neontokyo"] .article-item {
            border: 1px solid var(--border-color);
            background: linear-gradient(90deg, 
                rgba(255, 110, 199, 0.05) 0%,
                transparent 40%
            );
            position: relative;
            transition: all 0.3s;
        }

        [data-theme="neontokyo"] .article-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: linear-gradient(180deg, #ff6ec7, #7b68ee);
            opacity: 0.4;
            transition: opacity 0.3s;
        }

        [data-theme="neontokyo"] .article-item:hover::before {
            opacity: 1;
            box-shadow: var(--pink-glow);
        }

        [data-theme="neontokyo"] .article-item:hover {
            border-color: rgba(255, 110, 199, 0.5);
            background: var(--hover-bg);
            box-shadow: var(--shadow-sm);
        }

        [data-theme="neontokyo"] .article-item.active {
            background: linear-gradient(90deg, 
                rgba(255, 110, 199, 0.2) 0%,
                rgba(26, 10, 37, 0.95) 100%
            );
            border-color: #ff6ec7;
            box-shadow: var(--accent-glow);
        }

        [data-theme="neontokyo"] .content-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        [data-theme="neontokyo"] .content-panel::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, transparent 50%, rgba(255, 110, 199, 0.1) 50%);
            pointer-events: none;
        }

        [data-theme="neontokyo"] .form-input,
        [data-theme="neontokyo"] .editor-input,
        [data-theme="neontokyo"] .editor-select,
        [data-theme="neontokyo"] .editor-textarea {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        [data-theme="neontokyo"] .form-input:focus,
        [data-theme="neontokyo"] .editor-input:focus,
        [data-theme="neontokyo"] .editor-select:focus,
        [data-theme="neontokyo"] .editor-textarea:focus {
            border-color: #ff6ec7;
            box-shadow: 
                inset 0 0 20px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(255, 110, 199, 0.3),
                0 0 40px rgba(123, 104, 238, 0.15);
            outline: none;
        }

        [data-theme="neontokyo"] .btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        [data-theme="neontokyo"] .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        [data-theme="neontokyo"] .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        [data-theme="neontokyo"] .btn-primary {
            background: linear-gradient(135deg, #ff6ec7, #9d7fff);
            border: none;
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        [data-theme="neontokyo"] .btn-primary:hover {
            box-shadow: var(--accent-glow-strong);
            transform: translateY(-2px);
        }

        [data-theme="neontokyo"] .btn-danger {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            color: #fff;
        }

        [data-theme="neontokyo"] .btn-danger:hover {
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.6);
        }

        [data-theme="neontokyo"] .tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid rgba(255, 110, 199, 0.3);
            font-size: 0.75rem;
            box-shadow: 0 0 10px rgba(255, 110, 199, 0.2);
        }

        [data-theme="neontokyo"] .login-card {
            background: linear-gradient(135deg, #1a0a25, #251035);
            border: 1px solid rgba(255, 110, 199, 0.4);
            box-shadow: var(--shadow-lg), var(--accent-glow);
            position: relative;
        }

        [data-theme="neontokyo"] .login-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6ec7, transparent, #7b68ee, transparent);
            z-index: -1;
            animation: borderRotate 4s linear infinite;
        }

        [data-theme="neontokyo"] .theme-toggle {
            background: rgba(255, 110, 199, 0.15);
            border: 1px solid rgba(255, 110, 199, 0.5);
        }

        [data-theme="neontokyo"] .theme-toggle::before {
            background: linear-gradient(135deg, #ff6ec7, #7b68ee);
            box-shadow: 0 0 15px rgba(255, 110, 199, 0.8);
        }

        [data-theme="neontokyo"] .footer {
            background: linear-gradient(180deg, #150820, #0f0515);
            border-top: 1px solid rgba(255, 110, 199, 0.3);
        }

        [data-theme="neontokyo"] .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff6ec7, #7b68ee, transparent);
        }

        [data-theme="neontokyo"] .empty-state-icon {
            filter: drop-shadow(0 0 25px rgba(255, 110, 199, 0.7));
            animation: float 3s ease-in-out infinite;
        }

        [data-theme="neontokyo"] ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        [data-theme="neontokyo"] ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        [data-theme="neontokyo"] ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff6ec7, #7b68ee);
            border-radius: 4px;
        }

        [data-theme="neontokyo"] ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #ff9ed9, #9d7fff);
        }

        [data-theme="neontokyo"] ::selection {
            background: rgba(255, 110, 199, 0.3);
            color: #fff;
        }

        @keyframes neonFlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(60deg); }
        }

        @keyframes hologramSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes borderRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }


        /* ========== 基础样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);

        }

        /* ========== 页头 ========== */

        .navbar {

        .navbar-brand {

            font-weight: 700;

            display: flex;

        }

        .navbar-btn {

            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;

        .navbar-btn.primary {
            background: white;

            border: none;
        }

        .navbar-btn.primary:hover {
            background: #f8f9fa;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            width: 44px;
            height: 24px;
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            border: none;
        }

        .theme-toggle::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.3s;
        }

        [data-theme="dark"] .theme-toggle::before {
            transform: translateX(20px);
        }

        .theme-icon {
            font-size: 0.75rem;
            margin: 0 4px;
        }

        /* 移动端菜单 */
        .menu-toggle {
            display: none;

            padding: 5px;
            background: none;
            border: none;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: white;
            border-radius: 3px;
            transition: 0.3s;
        }

        /* ========== 主体 ========== */
        .main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ========== 登录页 ========== */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
        }

        .login-card {
            background: var(--bg-secondary);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        .login-title {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            font-size: 1.5rem;
        }

        .form-group { margin-bottom: 1.25rem; }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active { transform: translateY(0); }

        /* ========== 主界面 ========== */
        .content-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            background: var(--bg-sidebar);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 1rem;
            border: 1px solid var(--border-color);
        }

        .sidebar-section { margin-bottom: 1.5rem; }

        .sidebar-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-item {
            background: var(--accent-gradient);
            color: white;
            padding: 1.25rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .stat-number {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.75rem;
            opacity: 0.9;
            margin-top: 0.25rem;
        }

        .article-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .article-item {
            padding: 0.875rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.25rem;
            border: 1px solid transparent;
        }

        .article-item:hover {
            background: var(--hover-bg);
            border-color: var(--border-color);
        }

        .article-item.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
        }

        .article-item-title {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .article-item-meta {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 0.25rem;
        }

        /* ========== 内容区 ========== */
        .content-panel {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            min-height: 400px;
            border: 1px solid var(--border-color);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .content-title {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .content-actions { display: flex; gap: 0.5rem; }

        .btn-sm {
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-1px); }
        .btn-secondary { background: var(--hover-bg); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); }
        .btn-danger { background: #ff4757; color: white; }
        .btn-danger:hover { background: #ff3344; transform: translateY(-1px); }

        /* ========== 编辑器 ========== */
        .editor-group { margin-bottom: 1.5rem; }
        .editor-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .editor-input, .editor-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.3s;
        }
        .editor-input:focus, .editor-select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .editor-textarea {
            width: 100%;
            min-height: 300px;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            resize: vertical;
            background: var(--code-bg);
            color: var(--text-primary);
        }
        .editor-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
        }
        .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; }
        .empty-state h3 { color: var(--text-primary); margin-bottom: 0.5rem; }

        /* ========== 页脚 ========== */
        .footer {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 1.5rem 2rem;
            margin-top: auto;
            border-top: 1px solid var(--border-color);
        }
        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .footer-links { display: flex; gap: 1.5rem; }
        .footer-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .footer-link:hover { color: var(--accent-primary); }
        .footer-copyright { font-size: 0.85rem; opacity: 0.8; }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .navbar { padding: 1rem; }
            .menu-toggle { display: flex; }
            .navbar-menu {
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                background: var(--accent-gradient);
                flex-direction: column;
                padding: 1rem;
                gap: 0.5rem;
                transform: translateY(-150%);
                transition: transform 0.3s;
                box-shadow: var(--shadow-md);
            }
            .navbar-menu.active { transform: translateY(0); }
            .navbar-btn { width: 100%; text-align: center; }
            .main { padding: 1rem; }
            .content-layout { grid-template-columns: 1fr; }
            .sidebar { position: static; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .content-header { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
            .footer-content { flex-direction: column; text-align: center; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .content-panel { padding: 1.25rem; }
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
    </style>
</head>
<body>
    <!-- 页头 -->
    <header class="header">
        <nav class="navbar">
            <a href="/" class="navbar-brand">📚 Erudit</a>
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
            <div class="navbar-menu" id="navMenu">
                <button class="navbar-btn" onclick="showSearch()">🔍 搜索</button>
                <button class="navbar-btn" onclick="showRSS()">📡 RSS</button>
                <div class="navbar-btn" onclick="toggleTheme()" title="切换主题">
                    <span id="themeLabel">CYBER</span>
                    <span class="theme-icon">☀️</span>
                    <button class="theme-toggle"></button>
                    <span class="theme-icon">🌙</span>
                </div>
                <button class="navbar-btn primary" onclick="location.href='/admin'">⚙️ 管理后台</button>
            </div>
        </nav>
    </header>

    <!-- 主体 -->
    <main class="main">
        <div id="loginSection" class="login-wrapper">
            <div class="login-card">
                <h2 class="login-title">📚 Erudit 知识库</h2>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" onkeypress="if(event.key==='Enter') login()">
                </div>
                <button class="btn" onclick="login()">登录</button>
            </div>
        </div>
        <div id="mainSection" class="content-layout hidden">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-number" id="statArticles">0</div>
                            <div class="stat-label">文章</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="statCategories">0</div>
                            <div class="stat-label">分类</div>
                        </div>
                    </div>
                </div>
                <div class="sidebar-section">
                    <div class="sidebar-title">文章列表</div>
                    <ul class="article-list" id="articleList"></ul>
                </div>
            </aside>
            <div class="content-panel" id="contentPanel">
                <div class="empty-state">
                    <div class="empty-state-icon">📖</div>
                    <h3>欢迎使用 Erudit</h3>
                    <p>从左侧选择文章阅读</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="/" class="footer-link">首页</a>
                <a href="/admin" class="footer-link">管理后台</a>
                <a href="/api/docs" class="footer-link">API 文档</a>
                <a href="https://github.com/trencps/erudit" class="footer-link" target="_blank">GitHub</a>
            </div>
            <div class="footer-copyright">© 2026 Erudit</div>
        </div>
    </footer>

    <script>
        let token = '', articles = [], categories = [];

        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }

        // 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const themes = ["light", "dark", "cyberpunk", "neontokyo"];
            const idx = themes.indexOf(current);
            const next = themes[(idx + 1) % themes.length];
            html.setAttribute('data-theme', next);
            localStorage.setItem('erudit_theme', next);
            const label = document.getElementById('themeLabel');
            if (label) label.textContent = next.toUpperCase();
        }

        // 初始化主题
        (function initTheme() {
            const saved = localStorage.getItem('erudit_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();

        async function login() {
            const password = document.getElementById('password').value;
            if (!password) { alert('请输入密码'); return; }
            const resp = await fetch('/api/auth/login?password=' + encodeURIComponent(password));
            const data = await resp.json();
            if (data.token) {
                token = data.token;
                localStorage.setItem('erudit_token', token);
                showMain();
            } else { alert(data.detail || '密码错误'); }
        }

        function showMain() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            loadArticles();
        }

        async function loadArticles() {
            if (!token) return;
            const resp = await fetch('/api/articles?page=1&page_size=50', { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await resp.json();
            articles = data.articles || [];
            document.getElementById('statArticles').textContent = data.total || articles.length;
            renderList();
            await loadCategories();
        }

        async function loadCategories() {
            if (!token) return;
            const resp = await fetch('/api/categories', { headers: { 'Authorization': 'Bearer ' + token } });
            categories = await resp.json();
            document.getElementById('statCategories').textContent = categories.length || 0;
        }

        function renderList() {
            document.getElementById('articleList').innerHTML = articles.map(a =>
                '<li class="article-item" onclick="loadArticle(\\'' + a.slug + '\\')">' +
                '<div class="article-item-title">' + escapeHtml(a.title) + '</div>' +
                '<div class="article-item-meta">' + (a.category_id || '未分类') + '</div>' +
                '</li>'
            ).join('');
        }

        async function loadArticle(slug) {
            document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.article-item').classList.add('active');
            const resp = await fetch('/api/articles/' + slug, { headers: { 'Authorization': 'Bearer ' + token } });
            const article = await resp.json();
            document.getElementById('contentPanel').innerHTML = `
                <div class="content-header">
                    <h2 class="content-title">${escapeHtml(article.title)}</h2>
                    <div class="content-actions">
                        <button class="btn-sm btn-secondary" onclick="location.href='/admin'">✏️ 编辑</button>
                        <button class="btn-sm btn-secondary" onclick="exportArticle('${slug}')">📥 导出</button>
                    </div>
                </div>
                <div style="line-height:1.8;color:var(--text-primary);">
                    ${renderMarkdown(article.content)}
                </div>
            `;
        }

        function exportArticle(slug) {
            window.open('/api/exports/' + slug + '?format=markdown');
        }

        async function showSearch() {
            const keyword = prompt('请输入搜索关键词:');
            if (!keyword) return;
            const resp = await fetch('/api/search?keyword=' + encodeURIComponent(keyword), {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await resp.json();
            articles = data.articles || [];
            document.getElementById('statArticles').textContent = data.total || articles.length;
            renderList();
            document.getElementById('contentPanel').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><h3>搜索结果</h3><p>共找到 ' + (data.total || 0) + ' 篇文章</p></div>';
        }

        function showRSS() { window.open('/api/rss'); }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderMarkdown(text) {
            if (!text) return '';
            return text
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code style="background:var(--code-bg);padding:2px 6px;border-radius:4px;">$1</code>')
                .replace(/\n/g, '<br>');
        }

        const savedToken = localStorage.getItem('erudit_token');
        if (savedToken) { token = savedToken; showMain(); }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.navbar')) document.getElementById('navMenu').classList.remove('active');
        });
    </script>
</body>
</html>
