<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erudit - 个人知识库</title>
    <style>
        :root[data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8888aa;
            --border-color: #e0e0e8;
            --accent-primary: #667eea;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --hover-bg: rgba(102, 126, 234, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.12);
            --code-bg: #f5f5f7;
            --tag-bg: rgba(102, 126, 234, 0.1);
            --tag-text: #667eea;
        }
        :root[data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #b1bac4;
            --text-muted: #6e7681;
            --border-color: #30363d;
            --accent-primary: #7c8aff;
            --accent-gradient: linear-gradient(135deg, #7c8aff 0%, #a855f7 100%);
            --hover-bg: rgba(124, 138, 255, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
            --code-bg: #1a1f26;
            --tag-bg: rgba(124, 138, 255, 0.15);
            --tag-text: #7c8aff;
        }
        :root[data-theme="cyberpunk"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0cc;
            --text-muted: #5a5a8a;
            --border-color: #1a1a3a;
            --accent-primary: #00f0ff;
            --accent-gradient: linear-gradient(135deg, #00f0ff 0%, #ff00aa 100%);
            --accent-glow: 0 0 20px rgba(0, 240, 255, 0.5);
            --hover-bg: rgba(0, 240, 255, 0.1);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.8);
            --code-bg: #0a0a15;
            --tag-bg: rgba(0, 240, 255, 0.15);
            --tag-text: #00f0ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }
        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .navbar-nav { display: flex; gap: 8px; }
        .nav-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
        }
        .nav-btn:hover, .nav-btn.active { background: var(--hover-bg); color: var(--accent-primary); }
        .nav-btn.active { background: var(--accent-gradient); color: white; }
        .main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .article-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }
        .article-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .article-image { width: 100%; height: 180px; object-fit: cover; background: var(--code-bg); }
        .article-content-card { padding: 20px; }
        .article-card-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .article-card-summary { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .article-card-meta { display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border-color); font-size: 12px; color: var(--text-muted); }
        .article-card-category { padding: 4px 12px; background: var(--tag-bg); color: var(--tag-text); border-radius: 20px; }
        .article-view { max-width: 800px; margin: 0 auto; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; }
        .article-view-header { padding: 32px; border-bottom: 1px solid var(--border-color); }
        .article-view-title { font-size: 32px; font-weight: 700; margin-bottom: 16px; }
        .article-view-meta { color: var(--text-muted); font-size: 14px; }
        .article-view-image { width: 100%; max-height: 400px; object-fit: cover; }
        .article-view-content { padding: 32px; line-height: 1.8; color: var(--text-secondary); }
        .article-view-content h1, .article-view-content h2, .article-view-content h3 { margin: 32px 0 16px; color: var(--text-primary); }
        .article-view-content code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .article-view-content pre { background: var(--code-bg); padding: 20px; border-radius: 8px; overflow-x: auto; margin: 16px 0; }
        .article-view-content blockquote { border-left: 4px solid var(--accent-primary); padding-left: 20px; color: var(--text-muted); }
        .article-view-content a { color: var(--accent-primary); }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-secondary); cursor: pointer; margin-bottom: 20px; }
        .back-btn:hover { color: var(--accent-primary); }
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 24px 32px;
            text-align: center;
            color: var(--text-muted);
        }
        .footer-links { display: flex; justify-content: center; gap: 24px; margin-bottom: 12px; }
        .footer-links a, .footer-info a { color: var(--text-secondary); text-decoration: none; }
        .footer-info { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
        .admin-panel { position: fixed; bottom: 24px; right: 24px; z-index: 1000; }
        .admin-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            color: white;
            font-size: 24px;
            box-shadow: var(--shadow-lg);
        }
        .admin-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            min-width: 280px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s;
        }
        .admin-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .menu-title { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-secondary); }
        .menu-item:hover { background: var(--hover-bg); color: var(--accent-primary); }
        .theme-selector { display: flex; gap: 8px; padding: 12px; background: var(--code-bg); border-radius: 8px; margin-top: 8px; }
        .theme-btn { flex: 1; padding: 8px; border: 2px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary); cursor: pointer; font-size: 12px; color: var(--text-secondary); }
        .theme-btn.active { border-color: var(--accent-primary); color: var(--accent-primary); }
        .login-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .login-modal.show { opacity: 1; visibility: visible; }
        .login-modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 400px;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 24px; }
        .modal-title { font-size: 20px; font-weight: 700; }
        .modal-close { background: var(--code-bg); border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; margin-bottom: 8px; }
        .form-input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--accent-gradient); color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
        .loading { text-align: center; padding: 60px; color: var(--text-muted); }
        @media (max-width: 768px) {
            .articles-grid { grid-template-columns: 1fr; }
            .footer-links { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="navbar-brand">📚 Erudit</div>
        <nav class="navbar-nav" id="category-nav">
            <button class="nav-btn active" onclick="filterCategory('all')">全部</button>
        </nav>
    </header>
    <main class="main" id="main-content">
        <div class="loading">加载中</div>
    </main>
    <footer class="footer">
        <div class="footer-links">
            <a href="/">首页</a>
            <a href="/docs">API 文档</a>
            <a href="https://github.com/trencps/erudit" target="_blank">GitHub</a>
        </div>
        <div class="footer-info">
            <span id="footer-site-name">© 2026 Erudit v3.0.0 - 个人知识管理系统</span>
            <span>|</span>
            <span>友情链接:</span>
            <a href="https://hermes-studio.ai" target="_blank">Hermes Studio</a>
            <a href="https://github.com/EKKOLearnAI" target="_blank">EKKOLearnAI</a>
        </div>
    </footer>
    <div class="admin-panel">
        <div class="admin-menu" id="admin-menu">
            <div class="menu-title">统计信息</div>
            <div class="menu-item" style="cursor: default;"><span>📄</span><span id="stat-articles">0 篇文章</span></div>
            <div class="menu-item" style="cursor: default;"><span>📁</span><span id="stat-categories">0 个分类</span></div>
            <div class="menu-item" style="cursor: default;"><span>🏷️</span><span id="stat-tags">0 个标签</span></div>
            <div class="menu-title" style="margin-top: 12px;">主题切换</div>
            <div class="theme-selector">
                <button class="theme-btn active" onclick="setTheme('light')">☀️ 浅色</button>
                <button class="theme-btn" onclick="setTheme('dark')">🌙 深色</button>
                <button class="theme-btn" onclick="setTheme('cyberpunk')">💜 赛博</button>
            </div>
            <div class="menu-item" onclick="showLoginModal()"><span>🔐</span><span>后台登录</span></div>
            <div class="menu-item" onclick="window.open('/docs', '_blank')"><span>📖</span><span>API 文档</span></div>
            <div class="menu-item" onclick="window.open('/rss', '_blank')"><span>📡</span><span>RSS 订阅</span></div>
            <div class="menu-item" onclick="window.open('https://github.com/trencps/erudit', '_blank')"><span>⭐</span><span>GitHub</span></div>
        </div>
        <button class="admin-toggle" onclick="toggleAdminMenu()">⚙️</button>
    </div>
    <div class="login-modal" id="login-modal">
        <div class="login-modal-content">
            <div class="modal-header">
                <div class="modal-title">后台登录</div>
                <button class="modal-close" onclick="closeLoginModal()">×</button>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="login-password" placeholder="请输入管理密码">
            </div>
            <button class="btn" onclick="doLogin()">登录</button>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories(); loadArticles(); loadTheme(); loadSiteSettings();
            document.addEventListener('click', (e) => {
                if (!document.querySelector('.admin-panel').contains(e.target)) {
                    document.getElementById('admin-menu').classList.remove('show');
                }
            });
        });
        async function loadCategories() {
            try {
                const res = await fetch('/categories');
                const data = await res.json();
                const nav = document.getElementById('category-nav');
                nav.innerHTML = '<button class="nav-btn active" onclick="filterCategory(\'all\')">全部</button>';
                (data.categories || []).forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = 'nav-btn';
                    btn.dataset.categoryId = c.id;
                    btn.textContent = c.name;
                    btn.onclick = () => filterCategory(c.id);
                    nav.appendChild(btn);
                });
            } catch (e) { console.error(e); }
        }
        async function loadArticles(categoryId = 'all') {
            try {
                const res = await fetch('/articles');
                const data = await res.json();
                let articles = data.articles || [];
                if (categoryId !== 'all') articles = articles.filter(a => a.category_id === parseInt(categoryId));
                const main = document.getElementById('main-content');
                document.getElementById('stat-articles').textContent = `${data.articles?.length || 0} 篇文章`;
                document.getElementById('stat-categories').textContent = `${data.categories?.length || 0} 个分类`;
                document.getElementById('stat-tags').textContent = `${data.tags?.length || 0} 个标签`;
                if (articles.length > 0) {
                    main.innerHTML = `<div class="articles-grid">${articles.map(a => renderArticleCard(a)).join('')}</div>`;
                } else {
                    main.innerHTML = '<div class="loading">暂无文章</div>';
                }
            } catch (e) {
                document.getElementById('main-content').innerHTML = '<div class="loading">加载失败</div>';
            }
        }
        function renderArticleCard(a) {
            const ghImage = getGitHubImage(a.title, a.slug);
            const summary = extractSummary(a.content, 150);
            return `<div class="article-card" onclick="showArticle('${a.slug}')">
                <img src="${ghImage}" class="article-image" onerror="this.style.display='none'">
                <div class="article-content-card">
                    <div class="article-card-title">${a.title}</div>
                    <div class="article-card-summary">${summary}</div>
                    <div class="article-card-meta">
                        <span class="article-card-category">${a.category || '无分类'}</span>
                        <span>${a.created_at || '未知'}</span>
                    </div>
                </div>
            </div>`;
        }
        function getGitHubImage(title, slug) {
            const match = slug.match(/(\w+[-\w]*)/);
            if (match) return `https://opengraph.githubapi.com/github.com/trencps/${match[1]}`;
            return 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2YwZjJmNSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiM4ODg4OGEiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj7wn5aX5Lus5Zu95aSW5oiX5Yqx5Lmf6YOo5LiK5ZCN5Zu95aSW6K665YqoPC90ZXh0Pjwvc3ZnPg==';
        }
        function extractSummary(content, maxLength) {
            if (!content) return '暂无摘要...';
            let clean = content.replace(/```[\s\S]*?```/g, '').replace(/`[^`]+`/g, '').replace(/#{1,6}\s*/g, '').replace(/\*\*(.*?)\*\*/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\n+/g, ' ').trim();
            return clean.length <= maxLength ? clean : clean.substring(0, maxLength) + '...';
        }
        function filterCategory(categoryId) {
            document.querySelectorAll('#category-nav .nav-btn').forEach(btn => {
                btn.classList.toggle('active', categoryId === 'all' ? btn.textContent === '全部' : btn.dataset.categoryId == categoryId);
            });
            loadArticles(categoryId);
        }
        async function showArticle(slug) {
            try {
                const res = await fetch(`/articles/${slug}`);
                const data = await res.json();
                const ghImage = getGitHubImage(data.title, slug);
                document.getElementById('main-content').innerHTML = `
                    <button class="back-btn" onclick="loadArticles()">← 返回列表</button>
                    <div class="article-view">
                        <div class="article-view-header">
                            <h1 class="article-view-title">${data.title}</h1>
                            <div class="article-view-meta">
                                <span>📅 ${data.created_at || '未知'}</span>
                                ${data.category ? `<span>📁 ${data.category}</span>` : ''}
                            </div>
                        </div>
                        <img src="${ghImage}" class="article-view-image" onerror="this.style.display='none'">
                        <div class="article-view-content">${markdownToHtml(data.content)}</div>
                    </div>`;
            } catch (e) {
                document.getElementById('main-content').innerHTML = '<div class="loading">加载失败</div>';
            }
        }
        function markdownToHtml(md) {
            if (!md) return '';
            return md.replace(/^### (.*$)/gim, '<h3>$1</h3>').replace(/^## (.*$)/gim, '<h2>$1</h2>').replace(/^# (.*$)/gim, '<h1>$1</h1>').replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>').replace(/\n/gim, '<br />');
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('erudit-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.textContent.includes(theme === 'light' ? '浅色' : theme === 'dark' ? '深色' : '赛博')));
        }
        function loadTheme() {
            const saved = localStorage.getItem('erudit-theme') || 'light';
            setTheme(saved);
        }
        function loadSiteSettings() {
            try {
                const settings = JSON.parse(localStorage.getItem('erudit-settings') || '{}');
                if (settings.name) {
                    document.getElementById('footer-site-name').textContent = `© 2026 ${settings.name} v3.0.0 - 个人知识管理系统`;
                    document.title = `${settings.name} - 个人知识库`;
                }
                if (settings.links) {
                    const links = settings.links.split(',').map(l => l.trim());
                    const urls = (settings.urls || '').split(',').map(u => u.trim());
                    const footerInfo = document.querySelector('.footer-info');
                    footerInfo.innerHTML = `<span id="footer-site-name">${settings.name || 'Erudit'} © 2026</span><span>|</span><span>友情链接:</span>`;
                    links.forEach((link, idx) => {
                        footerInfo.innerHTML += `<a href="${urls[idx] || '#'}" target="_blank">${link}</a>`;
                    });
                }
            } catch (e) { console.error(e); }
        }
        function toggleAdminMenu() {
            document.getElementById('admin-menu').classList.toggle('show');
        }
        function showLoginModal() {
            document.getElementById('login-modal').classList.add('show');
            document.getElementById('login-password').focus();
        }
        function closeLoginModal() {
            document.getElementById('login-modal').classList.remove('show');
            document.getElementById('login-password').value = '';
        }
        async function doLogin() {
            const password = document.getElementById('login-password').value;
            if (!password) { alert('请输入密码'); return; }
            try {
                const res = await fetch(`/api/auth/login?password=${encodeURIComponent(password)}`);
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('erudit-token', data.token);
                    closeLoginModal();
                    window.location.href = '/admin';
                } else {
                    alert('密码错误');
                }
            } catch (e) { alert('登录失败'); }
        }
        document.getElementById('login-password')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
