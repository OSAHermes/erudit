<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erudit - 个人知识库</title>
    <style>
        /* ========== 浅色主题 ========== */
        :root[data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-sidebar: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8888aa;
            --border-color: #e0e0e8;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-glow: 0 4px 20px rgba(102, 126, 234, 0.3);
            --hover-bg: rgba(102, 126, 234, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.12);
            --code-bg: #f5f5f7;
            --tag-bg: rgba(102, 126, 234, 0.1);
            --tag-text: #667eea;
        }

        /* ========== 深色主题 ========== */
        :root[data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-sidebar: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #b1bac4;
            --text-muted: #6e7681;
            --border-color: #30363d;
            --accent-primary: #7c8aff;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #7c8aff 0%, #a855f7 100%);
            --accent-glow: 0 4px 20px rgba(124, 138, 255, 0.4);
            --hover-bg: rgba(124, 138, 255, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
            --code-bg: #1a1f26;
            --tag-bg: rgba(124, 138, 255, 0.15);
            --tag-text: #7c8aff;
        }

        /* ========== 赛博朋克主题 ========== */
        :root[data-theme="cyberpunk"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-sidebar: #0d0d15;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0cc;
            --text-muted: #5a5a8a;
            --border-color: #1a1a3a;
            --accent-primary: #00f0ff;
            --accent-secondary: #ff00aa;
            --accent-gradient: linear-gradient(135deg, #00f0ff 0%, #0080ff 50%, #ff00aa 100%);
            --accent-glow: 0 0 20px rgba(0, 240, 255, 0.5);
            --accent-glow-strong: 0 0 30px rgba(0, 240, 255, 0.8), 0 0 60px rgba(0, 240, 255, 0.4);
            --hover-bg: rgba(0, 240, 255, 0.1);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 240, 255, 0.1);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.2);
            --code-bg: #0a0a15;
            --tag-bg: rgba(0, 240, 255, 0.15);
            --tag-text: #00f0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        [data-theme="cyberpunk"] body {
            background: var(--bg-primary);
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 240, 255, 0.02) 2px, rgba(0, 240, 255, 0.02) 4px),
                linear-gradient(180deg, rgba(0, 240, 255, 0.02) 0%, transparent 50%, rgba(255, 0, 170, 0.02) 100%);
        }

        /* ========== 页头 ========== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s;
        }

        [data-theme="cyberpunk"] .header {
            background: linear-gradient(180deg, #0a0a15 0%, #12121a 100%);
            border-bottom: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow);
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        [data-theme="cyberpunk"] .navbar-brand {
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: var(--accent-glow);
        }

        .navbar-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .nav-btn.active {
            background: var(--accent-gradient);
            color: white;
        }

        /* ========== 主体 ========== */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* ========== 文章卡片网格 ========== */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .article-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        [data-theme="cyberpunk"] .article-card {
            border: 1px solid var(--border-color);
        }

        [data-theme="cyberpunk"] .article-card:hover {
            box-shadow: var(--accent-glow-strong);
            border-color: var(--accent-primary);
        }

        /* 文章图片 */
        .article-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: var(--code-bg);
            display: block;
        }

        .article-image-placeholder {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--code-bg) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--text-muted);
        }

        /* 文章内容 */
        .article-content-card {
            padding: 20px;
        }

        .article-card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-card-summary {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
        }

        .article-card-category {
            padding: 4px 12px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: 20px;
            font-size: 12px;
        }

        /* ========== 文章详情视图 ========== */
        .article-view {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        [data-theme="cyberpunk"] .article-view {
            border: 1px solid var(--border-color);
        }

        .article-view-header {
            padding: 32px;
            border-bottom: 1px solid var(--border-color);
        }

        .article-view-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .article-view-meta {
            display: flex;
            gap: 16px;
            color: var(--text-muted);
            font-size: 14px;
            flex-wrap: wrap;
        }

        .article-view-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
        }

        .article-view-content {
            padding: 32px;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .article-view-content h1, .article-view-content h2, .article-view-content h3 {
            margin: 32px 0 16px;
            color: var(--text-primary);
        }

        .article-view-content p {
            margin-bottom: 16px;
        }

        .article-view-content code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 14px;
        }

        .article-view-content pre {
            background: var(--code-bg);
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
        }

        .article-view-content pre code {
            background: none;
            padding: 0;
        }

        .article-view-content blockquote {
            border-left: 4px solid var(--accent-primary);
            padding-left: 20px;
            margin: 16px 0;
            color: var(--text-muted);
        }

        .article-view-content img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
        }

        .article-view-content a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        .article-view-content a:hover {
            text-decoration: underline;
        }

        .article-view-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }

        .article-view-content th, .article-view-content td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }

        .article-view-content th {
            background: var(--code-bg);
            font-weight: 600;
        }

        .article-view-content ul, .article-view-content ol {
            padding-left: 24px;
            margin: 16px 0;
        }

        .article-view-content li {
            margin: 8px 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        /* ========== 统计面板 ========== */
        .stats-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ========== 页脚 ========== */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 24px 32px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            transition: all 0.3s;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 12px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--accent-primary);
        }

        .footer-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer-divider {
            color: var(--text-muted);
        }

        .footer-info a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-info a:hover {
            color: var(--accent-primary);
        }

        /* ========== 右下角管理面板 ========== */
        .admin-panel {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }

        .admin-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--accent-glow-strong);
            transition: all 0.3s;
            color: white;
            font-size: 24px;
        }

        .admin-toggle:hover {
            transform: scale(1.1);
        }

        .admin-toggle.active {
            transform: rotate(45deg);
        }

        [data-theme="cyberpunk"] .admin-toggle {
            box-shadow: var(--accent-glow-strong);
            border: 1px solid var(--accent-primary);
        }

        .admin-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            min-width: 280px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s;
        }

        .admin-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        [data-theme="cyberpunk"] .admin-menu {
            border: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow-strong);
        }

        .menu-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .menu-item:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .menu-item-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--code-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .menu-item-content {
            flex: 1;
        }

        .menu-item-title {
            font-size: 14px;
            font-weight: 500;
        }

        .menu-item-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ========== 主题选择器 ========== */
        .theme-selector {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--code-bg);
            border-radius: 8px;
            margin-top: 8px;
        }

        .theme-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .theme-btn:hover, .theme-btn.active {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        [data-theme="cyberpunk"] .theme-btn.active {
            border-color: var(--accent-primary);
            box-shadow: var(--accent-glow);
        }

        /* ========== 登录弹窗 ========== */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .login-modal.show {
            opacity: 1;
            visibility: visible;
        }

        [data-theme="cyberpunk"] .login-modal {
            background: rgba(0, 0, 0, 0.8);
        }

        .login-modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 400px;
            transform: scale(0.9);
            transition: all 0.3s;
        }

        .login-modal.show .login-modal-content {
            transform: scale(1);
        }

        [data-theme="cyberpunk"] .login-modal-content {
            border: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow-strong);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--code-bg);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background: var(--accent-gradient);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }

        /* ========== 加载动画 ========== */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .main {
                padding: 16px;
            }

            .articles-grid {
                grid-template-columns: 1fr;
            }

            .article-view-title {
                font-size: 24px;
            }

            .stats-panel {
                flex-direction: column;
                gap: 16px;
            }

            .admin-panel {
                bottom: 16px;
                right: 16px;
            }

            .admin-menu {
                right: -8px;
                min-width: 260px;
            }
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
    </style>
</head>
<body>
    <!-- 页头 -->
    <header class="header">
        <div class="navbar-brand">📚 Erudit</div>
        <nav class="navbar-nav" id="category-nav">
            <button class="nav-btn active" onclick="filterCategory('all')">全部</button>
        </nav>
    </header>

    <!-- 主体 -->
    <main class="main" id="main-content">
        <div class="loading">加载中</div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-links">
            <a href="/">首页</a>
            <a href="/docs">API 文档</a>
            <a href="https://github.com/trencps/erudit" target="_blank">GitHub</a>
        </div>
        <div class="footer-info">
            <span>© 2026 Erudit v3.0.0 - 个人知识管理系统</span>
            <span class="footer-divider">|</span>
            <span>友情链接:</span>
            <a href="https://hermes-studio.ai" target="_blank">Hermes Studio</a>
            <a href="https://github.com/EKKOLearnAI" target="_blank">EKKOLearnAI</a>
        </div>
    </footer>

    <!-- 右下角管理面板 -->
    <div class="admin-panel">
        <div class="admin-menu" id="admin-menu">
            <div class="menu-title">管理面板</div>
            
            <!-- 主题切换 -->
            <div class="menu-item" onclick="toggleThemeMenu()">
                <div class="menu-item-icon">🎨</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">主题切换</div>
                    <div class="menu-item-desc">切换界面主题</div>
                </div>
            </div>
            <div class="theme-selector" id="theme-selector" style="display: none;">
                <button class="theme-btn active" data-theme="light" onclick="setTheme('light')">☀️ 浅色</button>
                <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">🌙 深色</button>
                <button class="theme-btn" data-theme="cyberpunk" onclick="setTheme('cyberpunk')">💜 赛博</button>
            </div>

            <!-- 后台登录 -->
            <div class="menu-item" onclick="showLoginModal()">
                <div class="menu-item-icon">🔐</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">后台登录</div>
                    <div class="menu-item-desc">管理员登录</div>
                </div>
            </div>

            <!-- API 文档 -->
            <div class="menu-item" onclick="window.open('/docs', '_blank')">
                <div class="menu-item-icon">📖</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">API 文档</div>
                    <div class="menu-item-desc">接口文档</div>
                </div>
            </div>

            <!-- RSS 订阅 -->
            <div class="menu-item" onclick="showRSS()">
                <div class="menu-item-icon">📡</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">RSS 订阅</div>
                    <div class="menu-item-desc">订阅最新文章</div>
                </div>
            </div>

            <!-- GitHub -->
            <div class="menu-item" onclick="window.open('https://github.com/trencps/erudit', '_blank')">
                <div class="menu-item-icon">⭐</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">GitHub</div>
                    <div class="menu-item-desc">查看源码</div>
                </div>
            </div>
        </div>
        <button class="admin-toggle" id="admin-toggle" onclick="toggleAdminMenu()">⚙️</button>
    </div>

    <!-- 登录弹窗 -->
    <div class="login-modal" id="login-modal">
        <div class="login-modal-content">
            <div class="modal-header">
                <div class="modal-title">后台登录</div>
                <button class="modal-close" onclick="closeLoginModal()">×</button>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="login-password" placeholder="请输入管理密码">
            </div>
            <button class="btn" onclick="doLogin()">登录</button>
            <div class="error-msg" id="login-error"></div>
        </div>
    </div>

    <script>
        let currentArticle = null;
        let token = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadArticles();
            loadTheme();
            
            // 点击外部关闭菜单
            document.addEventListener('click', (e) => {
                const panel = document.querySelector('.admin-panel');
                if (!panel.contains(e.target)) {
                    document.getElementById('admin-menu').classList.remove('show');
                    document.getElementById('admin-toggle').classList.remove('active');
                }
            });
        });

        // 加载分类
        async function loadCategories() {
            try {
                const res = await fetch('/categories');
                const data = await res.json();
                
                // 更新导航
                const nav = document.getElementById('category-nav');
                nav.innerHTML = '<button class="nav-btn active" onclick="filterCategory(\'all\')">全部</button>';
                
                if (data.categories) {
                    data.categories.forEach(c => {
                        const btn = document.createElement('button');
                        btn.className = 'nav-btn';
                        btn.dataset.categoryId = c.id;
                        btn.textContent = c.name;
                        btn.onclick = () => filterCategory(c.id);
                        nav.appendChild(btn);
                    });
                }
                
                // 更新统计
                document.getElementById('stat-categories') && (document.getElementById('stat-categories').textContent = data.categories?.length || 0);
            } catch (e) {
                console.error('Load categories error:', e);
            }
        }

        // 加载文章列表
        async function loadArticles(categoryId = 'all') {
            try {
                const res = await fetch('/articles');
                const data = await res.json();
                console.log('Articles response:', data);
                
                let articles = data.articles || [];
                if (categoryId !== 'all') {
                    articles = articles.filter(a => a.category_id === parseInt(categoryId));
                }
                
                const main = document.getElementById('main-content');
                
                if (articles.length > 0) {
                    main.innerHTML = `
                        <div class="stats-panel">
                            <div class="stat-item">
                                <span class="stat-number">${data.articles?.length || 0}</span>
                                <span class="stat-label">文章数</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-number">${data.categories?.length || 0}</span>
                                <span class="stat-label">分类数</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-number">${data.tags?.length || 0}</span>
                                <span class="stat-label">标签数</span>
                            </div>
                        </div>
                        <div class="articles-grid" id="articles-grid">
                            ${articles.map(a => renderArticleCard(a)).join('')}
                        </div>
                    `;
                } else {
                    main.innerHTML = '<div class="loading">暂无文章</div>';
                }
            } catch (e) {
                console.error('Load articles error:', e);
                document.getElementById('main-content').innerHTML = '<div class="loading">加载失败</div>';
            }
        }

        // 渲染文章卡片
        function renderArticleCard(a) {
            const ghImage = getGitHubImage(a.title, a.slug);
            const summary = extractSummary(a.content, 150);
            
            return `
                <div class="article-card" onclick="showArticle('${a.slug}')">
                    <div class="article-image-placeholder">
                        <img src="${ghImage}" alt="${a.title}" class="article-image" onerror="this.style.display='none'">
                    </div>
                    <div class="article-content-card">
                        <div class="article-card-title">${a.title}</div>
                        <div class="article-card-summary">${summary}</div>
                        <div class="article-card-meta">
                            <span class="article-card-category">${a.category || '无分类'}</span>
                            <span>${a.created_at || '未知'}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 获取 GitHub 项目图片
        function getGitHubImage(title, slug) {
            // 尝试从 slug 提取项目名
            const match = slug.match(/github\.com\/([^\/]+)\/([^\/]+)/) || slug.match(/(\w+[-\w]*)/);
            if (match) {
                const projName = match[match.length - 1];
                return `https://opengraph.githubapi.com/github.com/trencps/${projName}`;
            }
            return 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2YwZjJmNSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiM4ODg4OGEiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj7wn5aX5Lus5Zu95aSW5oiX5Yqx5Lmf6YOo5LiK5ZCN5Zu95aSW6K665YqoPC90ZXh0Pjwvc3ZnPg==';
        }

        // 提取摘要
        function extractSummary(content, maxLength) {
            if (!content) return '暂无摘要...';
            
            let clean = content
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`]+`/g, '')
                .replace(/#{1,6}\s*/g, '')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*(.*?)\*/g, '$1')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/!\[[^\]]*\]\([^)]+\)/g, '')
                .replace(/\n+/g, ' ')
                .trim();
            
            if (clean.length <= maxLength) return clean;
            
            return clean.substring(0, maxLength) + '...';
        }

        // 分类筛选
        function filterCategory(categoryId) {
            document.querySelectorAll('#category-nav .nav-btn').forEach(btn => {
                btn.classList.remove('active');
                if (categoryId === 'all' && btn.textContent === '全部') {
                    btn.classList.add('active');
                } else if (btn.dataset.categoryId === categoryId) {
                    btn.classList.add('active');
                }
            });
            loadArticles(categoryId);
        }

        // 显示文章
        async function showArticle(slug) {
            try {
                const res = await fetch(`/articles/${slug}`);
                const data = await res.json();
                console.log('Article data:', data);
                currentArticle = data;
                
                const ghImage = getGitHubImage(data.title, slug);
                
                document.getElementById('main-content').innerHTML = `
                    <button class="back-btn" onclick="loadArticles()">← 返回列表</button>
                    <div class="article-view">
                        <div class="article-view-header">
                            <h1 class="article-view-title">${data.title}</h1>
                            <div class="article-view-meta">
                                <span>📅 ${data.created_at || '未知'}</span>
                                ${data.category ? `<span>📁 ${data.category}</span>` : ''}
                                ${data.tags ? `<span>🏷️ ${typeof data.tags === 'string' ? data.tags : data.tags.join(', ')}</span>` : ''}
                            </div>
                        </div>
                        <img src="${ghImage}" alt="${data.title}" class="article-view-image" onerror="this.style.display='none'">
                        <div class="article-view-content">${markdownToHtml(data.content)}</div>
                    </div>
                `;
            } catch (e) {
                console.error('Show article error:', e);
                document.getElementById('main-content').innerHTML = '<div class="loading">加载失败</div>';
            }
        }

        // 简单的 Markdown 转 HTML
        function markdownToHtml(md) {
            if (!md) return '';
            return md
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\*(.*)\*/gim, '<em>$1</em>')
                .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/gim, '<code>$1</code>')
                .replace(/\n/gim, '<br />');
        }

        // RSS
        function showRSS() {
            window.open('/rss', '_blank');
        }

        // 管理面板切换
        function toggleAdminMenu() {
            const menu = document.getElementById('admin-menu');
            const toggle = document.getElementById('admin-toggle');
            menu.classList.toggle('show');
            toggle.classList.toggle('active');
        }

        // 主题菜单切换
        function toggleThemeMenu() {
            const selector = document.getElementById('theme-selector');
            selector.style.display = selector.style.display === 'none' ? 'flex' : 'none';
        }

        // 设置主题
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('erudit-theme', theme);
            
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        // 加载主题
        function loadTheme() {
            const saved = localStorage.getItem('erudit-theme') || 'light';
            setTheme(saved);
        }

        // 登录弹窗
        function showLoginModal() {
            document.getElementById('login-modal').classList.add('show');
            document.getElementById('login-password').focus();
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.remove('show');
            document.getElementById('login-password').value = '';
            document.getElementById('login-error').textContent = '';
        }

        // 登录
        async function doLogin() {
            const password = document.getElementById('login-password').value;
            if (!password) {
                document.getElementById('login-error').textContent = '请输入密码';
                return;
            }
            
            try {
                const res = await fetch(`/api/auth/login?password=${encodeURIComponent(password)}`);
                const data = await res.json();
                
                if (data.token) {
                    token = data.token;
                    localStorage.setItem('erudit-token', token);
                    closeLoginModal();
                    alert('登录成功！');
                    window.location.href = '/admin';
                } else {
                    document.getElementById('login-error').textContent = '密码错误';
                }
            } catch (e) {
                document.getElementById('login-error').textContent = '登录失败，请重试';
            }
        }

        // 回车登录
        document.getElementById('login-password')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
