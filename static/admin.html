<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erudit - 管理后台</title>
    <style>
        /* ========== 主题变量 ========== */
        :root[data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-sidebar: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8888a8;
            --border-color: #e1e4e8;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --hover-bg: #f5f7fa;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
            --code-bg: #f6f8fa;
            --tag-bg: #e3f2fd;
            --tag-text: #1976d2;
        }

        :root[data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-sidebar: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #b1bac4;
            --text-muted: #6e7681;
            --border-color: #30363d;
            --accent-primary: #7c8aff;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #7c8aff 0%, #a855f7 100%);
            --hover-bg: #1f2937;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.5);
            --code-bg: #1f2937;
            --tag-bg: #1e3a5f;
            --tag-text: #79c0ff;
        }

        /* ========== 基础样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        /* ========== 页头 ========== */
        .header {
            background: var(--accent-gradient);
            color: white;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar-menu {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .navbar-btn {
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .navbar-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }

        .navbar-btn.primary {
            background: white;
            color: var(--accent-primary);
            font-weight: 600;
            border: none;
        }

        /* 主题切换 */
        .theme-toggle {
            width: 44px;
            height: 24px;
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            border: none;
        }

        .theme-toggle::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.3s;
        }

        [data-theme="dark"] .theme-toggle::before {
            transform: translateX(20px);
        }

        .theme-icon {
            font-size: 0.75rem;
            margin: 0 4px;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
            background: none;
            border: none;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: white;
            border-radius: 3px;
            transition: 0.3s;
        }

        /* ========== 主体 ========== */
        .main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ========== 登录页 ========== */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
        }

        .login-card {
            background: var(--bg-secondary);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        .login-title {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            font-size: 1.5rem;
        }

        .form-group { margin-bottom: 1.25rem; }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        /* ========== 主界面 ========== */
        .content-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            background: var(--bg-sidebar);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 1rem;
            border: 1px solid var(--border-color);
        }

        .sidebar-section { margin-bottom: 1.5rem; }

        .sidebar-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-item {
            background: var(--accent-gradient);
            color: white;
            padding: 1.25rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .stat-number { font-size: 1.75rem; font-weight: 700; }
        .stat-label { font-size: 0.75rem; opacity: 0.9; margin-top: 0.25rem; }

        .article-list { list-style: none; max-height: 400px; overflow-y: auto; }

        .article-item {
            padding: 0.875rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.25rem;
            border: 1px solid transparent;
        }

        .article-item:hover { background: var(--hover-bg); border-color: var(--border-color); }
        .article-item.active { background: var(--accent-gradient); color: white; border-color: transparent; }
        .article-item-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .article-item-meta { font-size: 0.75rem; opacity: 0.7; margin-top: 0.25rem; }

        /* ========== 内容区 ========== */
        .content-panel {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            min-height: 400px;
            border: 1px solid var(--border-color);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .content-title { font-size: 1.5rem; color: var(--text-primary); }
        .content-actions { display: flex; gap: 0.5rem; }

        .btn-sm {
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-1px); }
        .btn-secondary { background: var(--hover-bg); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-color); }
        .btn-danger { background: #ff4757; color: white; }
        .btn-danger:hover { background: #ff3344; transform: translateY(-1px); }

        /* ========== 编辑器 ========== */
        .editor-group { margin-bottom: 1.5rem; }
        .editor-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .editor-input, .editor-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.3s;
        }
        .editor-input:focus, .editor-select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .editor-textarea {
            width: 100%;
            min-height: 300px;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            resize: vertical;
            background: var(--code-bg);
            color: var(--text-primary);
        }
        .editor-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
        }
        .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; }
        .empty-state h3 { color: var(--text-primary); margin-bottom: 0.5rem; }

        /* ========== 页脚 ========== */
        .footer {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 1.5rem 2rem;
            margin-top: auto;
            border-top: 1px solid var(--border-color);
        }
        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .footer-links { display: flex; gap: 1.5rem; }
        .footer-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .footer-link:hover { color: var(--accent-primary); }
        .footer-copyright { font-size: 0.85rem; opacity: 0.8; }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .navbar { padding: 1rem; }
            .menu-toggle { display: flex; }
            .navbar-menu {
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                background: var(--accent-gradient);
                flex-direction: column;
                padding: 1rem;
                gap: 0.5rem;
                transform: translateY(-150%);
                transition: transform 0.3s;
                box-shadow: var(--shadow-md);
            }
            .navbar-menu.active { transform: translateY(0); }
            .navbar-btn { width: 100%; text-align: center; }
            .main { padding: 1rem; }
            .content-layout { grid-template-columns: 1fr; }
            .sidebar { position: static; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .content-header { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
            .footer-content { flex-direction: column; text-align: center; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .content-panel { padding: 1.25rem; }
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
    </style>
</head>
<body>
    <!-- 页头 -->
    <header class="header">
        <nav class="navbar">
            <a href="/admin" class="navbar-brand">⚙️ Erudit 管理</a>
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
            <div class="navbar-menu" id="navMenu">
                <button class="navbar-btn primary" onclick="showCreate()">+ 新建</button>
                <button class="navbar-btn" onclick="showBackup()">💾 备份</button>
                <button class="navbar-btn" onclick="showCleanup()">🗑️ 清理</button>
                <button class="navbar-btn" onclick="showRSS()">📡 RSS</button>
                <button class="navbar-btn" onclick="showChangePassword()">🔑 密码</button>
                <div class="navbar-btn" onclick="toggleTheme()" title="切换主题">
                    <span class="theme-icon">☀️</span>
                    <button class="theme-toggle"></button>
                    <span class="theme-icon">🌙</span>
                </div>
                <button class="navbar-btn" onclick="location.href='/'">📖 前台</button>
            </div>
        </nav>
    </header>

    <!-- 主体 -->
    <main class="main">
        <div id="loginSection" class="login-wrapper">
            <div class="login-card">
                <h2 class="login-title">⚙️ Erudit 管理后台</h2>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" onkeypress="if(event.key==='Enter') login()">
                </div>
                <button class="btn" onclick="login()">登录</button>
            </div>
        </div>
        <div id="mainSection" class="content-layout hidden">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-number" id="statArticles">0</div>
                            <div class="stat-label">文章</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="statCategories">0</div>
                            <div class="stat-label">分类</div>
                        </div>
                    </div>
                </div>
                <div class="sidebar-section">
                    <div class="sidebar-title">文章列表</div>
                    <ul class="article-list" id="articleList"></ul>
                </div>
            </aside>
            <div class="content-panel" id="contentPanel">
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <h3>管理后台</h3>
                    <p>选择文章进行编辑，或创建新文章</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="/" class="footer-link">前台首页</a>
                <a href="/api/docs" class="footer-link">API 文档</a>
                <a href="https://github.com/trencps/erudit" class="footer-link" target="_blank">GitHub</a>
            </div>
            <div class="footer-copyright">© 2026 Erudit</div>
        </div>
    </footer>

    <script>
        let token = '', articles = [], categories = [];

        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }

        // 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('erudit_theme', next);
        }

        // 初始化主题
        (function initTheme() {
            const saved = localStorage.getItem('erudit_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();

        async function login() {
            const password = document.getElementById('password').value;
            if (!password) { alert('请输入密码'); return; }
            const resp = await fetch('/api/auth/login?password=' + encodeURIComponent(password));
            const data = await resp.json();
            if (data.token) {
                token = data.token;
                localStorage.setItem('erudit_token', token);
                showMain();
            } else { alert(data.detail || '密码错误'); }
        }

        function showMain() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            loadArticles();
        }

        async function loadArticles() {
            if (!token) return;
            const resp = await fetch('/api/articles?page=1&page_size=50', { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await resp.json();
            articles = data.articles || [];
            document.getElementById('statArticles').textContent = data.total || articles.length;
            renderList();
            await loadCategories();
        }

        async function loadCategories() {
            if (!token) return;
            const resp = await fetch('/api/categories', { headers: { 'Authorization': 'Bearer ' + token } });
            categories = await resp.json();
            document.getElementById('statCategories').textContent = categories.length || 0;
        }

        function renderList() {
            document.getElementById('articleList').innerHTML = articles.map(a =>
                '<li class="article-item" onclick="loadArticle(\\'' + a.slug + '\\')">' +
                '<div class="article-item-title">' + escapeHtml(a.title) + '</div>' +
                '<div class="article-item-meta">' + (a.category_id || '未分类') + '</div>' +
                '</li>'
            ).join('');
        }

        async function loadArticle(slug) {
            document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.article-item').classList.add('active');
            const resp = await fetch('/api/articles/' + slug, { headers: { 'Authorization': 'Bearer ' + token } });
            const article = await resp.json();
            document.getElementById('contentPanel').innerHTML = `
                <div class="content-header">
                    <h2 class="content-title">${escapeHtml(article.title)}</h2>
                    <div class="content-actions">
                        <button class="btn-sm btn-secondary" onclick="exportArticle('${slug}')">📥 导出</button>
                        <button class="btn-sm btn-danger" onclick="deleteArticle('${slug}')">🗑️ 删除</button>
                    </div>
                </div>
                <div class="editor-group">
                    <label class="editor-label">标题</label>
                    <input type="text" class="editor-input" id="editTitle" value="${escapeHtml(article.title)}">
                </div>
                <div class="editor-group">
                    <label class="editor-label">分类</label>
                    <select class="editor-input" id="editCategory">
                        <option value="">无分类</option>
                        ${categories.map(c => `<option value="${c.id}" ${article.category_id == c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                    </select>
                </div>
                <div class="editor-group">
                    <label class="editor-label">内容 (Markdown)</label>
                    <textarea class="editor-textarea" id="editContent">${escapeHtml(article.content)}</textarea>
                </div>
                <div class="content-actions">
                    <button class="btn-sm btn-primary" onclick="saveArticle('${slug}')">保存</button>
                </div>
                <div style="margin-top:1rem;padding:1rem;background:var(--hover-bg);border-radius:8px;">
                    <p><strong>发布:</strong> ${article.created_at}</p>
                    <p><strong>更新:</strong> ${article.updated_at}</p>
                </div>
            `;
        }

        async function saveArticle(slug) {
            const title = document.getElementById('editTitle').value;
            const content = document.getElementById('editContent').value;
            const category_id = document.getElementById('editCategory').value;
            await fetch('/api/articles/' + slug, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content, category_id: category_id || null })
            });
            alert('保存成功');
            loadArticles();
        }

        async function deleteArticle(slug) {
            if (!confirm('确定删除？')) return;
            await fetch('/api/articles/' + slug, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
            alert('删除成功');
            loadArticles();
        }

        function exportArticle(slug) {
            window.open('/api/exports/' + slug + '?format=markdown');
        }

        function showCreate() {
            document.getElementById('contentPanel').innerHTML = `
                <div class="content-header">
                    <h2 class="content-title">新建文章</h2>
                    <div class="content-actions">
                        <button class="btn-sm btn-secondary" onclick="showWelcome()">取消</button>
                        <button class="btn-sm btn-primary" onclick="createArticle()">创建</button>
                    </div>
                </div>
                <div class="editor-group">
                    <label class="editor-label">标题</label>
                    <input type="text" class="editor-input" id="newTitle" placeholder="请输入文章标题">
                </div>
                <div class="editor-group">
                    <label class="editor-label">分类</label>
                    <select class="editor-input" id="newCategory">
                        <option value="">无分类</option>
                        ${categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                    </select>
                </div>
                <div class="editor-group">
                    <label class="editor-label">内容 (Markdown)</label>
                    <textarea class="editor-textarea" id="newContent" placeholder="# 标题

## 章节

内容..."></textarea>
                </div>
                <div class="editor-group">
                    <label class="editor-label">标签 (逗号分隔)</label>
                    <input type="text" class="editor-input" id="newTags" placeholder="docker, fastapi, 教程">
                </div>
            `;
        }

        async function createArticle() {
            const title = document.getElementById('newTitle').value;
            const content = document.getElementById('newContent').value;
            const category_id = document.getElementById('newCategory').value;
            const tags = document.getElementById('newTags').value.split(',').map(t => t.trim()).filter(t => t);
            if (!title || !content) { alert('标题和内容不能为空'); return; }
            await fetch('/api/articles', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content, category_id: category_id || null, tags })
            });
            alert('创建成功');
            loadArticles();
        }

        function showWelcome() {
            document.getElementById('contentPanel').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <h3>管理后台</h3>
                    <p>选择文章进行编辑，或创建新文章</p>
                </div>
            `;
        }

        function showBackup() {
            if (confirm('创建备份？')) {
                fetch('/api/backup', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } })
                    .then(r => r.json()).then(d => alert('备份: ' + d.filename));
            }
        }

        function showCleanup() {
            if (confirm('清理超过7天的旧备份？')) {
                fetch('/api/backup/cleanup', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } })
                    .then(r => r.json()).then(d => alert(d.message || '清理完成'));
            }
        }

        function showRSS() { window.open('/api/rss'); }

        async function showChangePassword() {
            const oldPwd = prompt('请输入旧密码:');
            if (!oldPwd) return;
            const newPwd = prompt('请输入新密码 (至少4位):');
            if (!newPwd || newPwd.length < 4) { alert('新密码至少4位'); return; }
            const confirmPwd = prompt('请确认新密码:');
            if (newPwd !== confirmPwd) { alert('密码不一致'); return; }
            const resp = await fetch('/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Authorization': 'Bearer ' + token },
                body: 'old_password=' + encodeURIComponent(oldPwd) + '&new_password=' + encodeURIComponent(newPwd)
            });
            const data = await resp.json();
            if (data.message) {
                alert('密码修改成功，请重新登录');
                localStorage.removeItem('erudit_token');
                location.reload();
            } else { alert(data.detail || '修改失败'); }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        const savedToken = localStorage.getItem('erudit_token');
        if (savedToken) { token = savedToken; showMain(); }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.navbar')) document.getElementById('navMenu').classList.remove('active');
        });
    </script>
</body>
</html>
