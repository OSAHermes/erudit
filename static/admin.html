<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erudit - 管理后台</title>
    <style>
        :root[data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8888aa;
            --border-color: #e0e0e8;
            --accent-primary: #667eea;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --hover-bg: rgba(102, 126, 234, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.12);
            --code-bg: #f5f5f7;
        }
        :root[data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #b1bac4;
            --text-muted: #6e7681;
            --border-color: #30363d;
            --accent-primary: #7c8aff;
            --accent-gradient: linear-gradient(135deg, #7c8aff 0%, #a855f7 100%);
            --hover-bg: rgba(124, 138, 255, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
            --code-bg: #1a1f26;
        }
        :root[data-theme="cyberpunk"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0cc;
            --text-muted: #5a5a8a;
            --border-color: #1a1a3a;
            --accent-primary: #00f0ff;
            --accent-gradient: linear-gradient(135deg, #00f0ff 0%, #ff00aa 100%);
            --accent-glow: 0 0 20px rgba(0, 240, 255, 0.5);
            --hover-bg: rgba(0, 240, 255, 0.1);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.8);
            --code-bg: #0a0a15;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }
        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .main { padding: 32px; max-width: 1200px; margin: 0 auto; }
        .page-title { font-size: 28px; font-weight: 700; margin-bottom: 24px; }
        .form-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
        }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
        }
        .form-textarea { min-height: 300px; font-family: monospace; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: var(--accent-gradient);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn.secondary { background: var(--code-bg); color: var(--text-secondary); }
        .category-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .category-actions { display: flex; gap: 8px; }
        .action-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
        }
        .action-btn.danger:hover { color: #ef4444; border-color: #ef4444; }
        .article-list {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }
        .article-item {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .article-info h3 { font-size: 16px; margin-bottom: 4px; }
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
        }
        .admin-panel {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }
        .admin-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            color: white;
            font-size: 24px;
            box-shadow: var(--shadow-lg);
        }
        .admin-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            min-width: 280px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s;
        }
        .admin-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .menu-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .menu-item:hover { background: var(--hover-bg); color: var(--accent-primary); }
        .theme-selector {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--code-bg);
            border-radius: 8px;
            margin-top: 8px;
        }
        .theme-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .theme-btn.active { border-color: var(--accent-primary); color: var(--accent-primary); }
    </style>
</head>
<body>
    <header class="header">
        <div class="navbar-brand">⚙️ Erudit 后台</div>
    </header>
    <main class="main">
        <h1 class="page-title">文章管理</h1>
        <div class="form-card">
            <h2 class="card-title">📁 分类管理</h2>
            <div class="category-list" id="category-list">加载中...</div>
            <div style="display: flex; gap: 12px; margin-top: 16px;">
                <input type="text" class="form-input" id="new-category-name" placeholder="分类名称">
                <button class="btn" onclick="createCategory()">创建</button>
            </div>
        </div>
        <div class="form-card">
            <h2 class="card-title">📝 创建新文章</h2>
            <div class="form-group">
                <label class="form-label">标题</label>
                <input type="text" class="form-input" id="article-title">
            </div>
            <div class="form-group">
                <label class="form-label">分类</label>
                <select class="form-select" id="article-category"><option value="">无分类</option></select>
            </div>
            <div class="form-group">
                <label class="form-label">内容 (Markdown)</label>
                <textarea class="form-textarea" id="article-content"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">标签（逗号分隔）</label>
                <input type="text" class="form-input" id="article-tags" placeholder="docker, fastapi, 教程">
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn" onclick="createArticle()">发布文章</button>
                <button class="btn secondary" onclick="clearForm()">清空</button>
            </div>
        </div>
        <div class="article-list">
            <div style="padding: 20px 24px; border-bottom: 1px solid var(--border-color);">
                <h3>📄 已有文章</h3>
            </div>
            <div id="article-list">加载中...</div>
        </div>
    </main>
    <footer class="footer">© 2026 Erudit - 个人知识管理系统</footer>
    <div class="admin-panel">
        <div class="admin-menu" id="admin-menu">
            <div class="menu-title">统计信息</div>
            <div class="menu-item" style="cursor: default;">
                <span>📄</span>
                <span id="stat-articles">0 篇文章</span>
            </div>
            <div class="menu-item" style="cursor: default;">
                <span>📁</span>
                <span id="stat-categories">0 个分类</span>
            </div>
            <div class="menu-item" style="cursor: default;">
                <span>🏷️</span>
                <span id="stat-tags">0 个标签</span>
            </div>
            <div class="menu-title" style="margin-top: 12px;">主题切换</div>
            <div class="theme-selector">
                <button class="theme-btn active" onclick="setTheme('light')">☀️ 浅色</button>
                <button class="theme-btn" onclick="setTheme('dark')">🌙 深色</button>
                <button class="theme-btn" onclick="setTheme('cyberpunk')">💜 赛博</button>
            </div>
            <div class="menu-title" style="margin-top: 12px;">站点设置</div>
            <div class="menu-item" onclick="showSettings()">
                <span>⚙️</span>
                <span>站点名称、友链</span>
            </div>
            <div class="menu-title" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color);">快捷操作</div>
            <div class="menu-item" onclick="window.location.href='/'">
                <span>🏠</span>
                <span>返回前台</span>
            </div>
            <div class="menu-item" onclick="window.open('/docs', '_blank')">
                <span>📖</span>
                <span>API 文档</span>
            </div>
            <div class="menu-item" onclick="window.open('https://github.com/trencps/erudit', '_blank')">
                <span>⭐</span>
                <span>GitHub</span>
            </div>
        </div>
        <button class="admin-toggle" onclick="toggleAdminMenu()">⚙️</button>
    </div>
    <script>
        let token = localStorage.getItem('erudit-token');
        document.addEventListener('DOMContentLoaded', () => {
            if (!token) { window.location.href = '/'; return; }
            loadStats(); loadCategories(); loadArticles(); loadTheme();
            document.addEventListener('click', (e) => {
                if (!document.querySelector('.admin-panel').contains(e.target)) {
                    document.getElementById('admin-menu').classList.remove('show');
                }
            });
        });
        async function loadStats() {
            try {
                const res = await fetch('/stats');
                const data = await res.json();
                document.getElementById('stat-articles').textContent = `${data.articles || 0} 篇文章`;
                document.getElementById('stat-categories').textContent = `${data.categories || 0} 个分类`;
                document.getElementById('stat-tags').textContent = `${data.tags || 0} 个标签`;
            } catch (e) { console.error(e); }
        }
        async function loadCategories() {
            try {
                const res = await fetch('/categories');
                const data = await res.json();
                const list = document.getElementById('category-list');
                const select = document.getElementById('article-category');
                if (data.categories?.length) {
                    list.innerHTML = data.categories.map(c => `
                        <div class="category-item">
                            <div><strong>${c.name}</strong><br><small style="color:var(--text-muted)">${c.description || ''}</small></div>
                            <button class="action-btn danger" onclick="deleteCategory(${c.id})">删除</button>
                        </div>`).join('');
                    select.innerHTML = '<option value="">无分类</option>' + data.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                } else {
                    list.innerHTML = '<div style="text-align:center;color:var(--text-muted)">暂无分类</div>';
                }
            } catch (e) { document.getElementById('category-list').innerHTML = '加载失败'; }
        }
        async function createCategory() {
            const name = document.getElementById('new-category-name').value.trim();
            if (!name) { alert('请输入分类名称'); return; }
            try {
                const res = await fetch('/categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ name })
                });
                if (res.ok) { document.getElementById('new-category-name').value = ''; loadCategories(); loadStats(); }
            } catch (e) { alert('创建失败'); }
        }
        async function deleteCategory(id) {
            if (!confirm('确定删除？')) return;
            await fetch(`/categories/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadCategories(); loadStats();
        }
        async function loadArticles() {
            try {
                const res = await fetch('/articles', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const list = document.getElementById('article-list');
                list.innerHTML = (data.articles || []).map(a => `
                    <div class="article-item">
                        <div class="article-info">
                            <h3>${a.title}</h3>
                            <p>${a.created_at || '未知'} ${a.category ? '• ' + a.category : ''}</p>
                        </div>
                        <div class="category-actions">
                            <button class="action-btn" onclick="editArticle('${a.slug}')">编辑</button>
                            <button class="action-btn danger" onclick="deleteArticle('${a.slug}')">删除</button>
                        </div>
                    </div>`).join('');
            } catch (e) { document.getElementById('article-list').innerHTML = '加载失败'; }
        }
        async function createArticle() {
            const title = document.getElementById('article-title').value.trim();
            const content = document.getElementById('article-content').value.trim();
            if (!title || !content) { alert('请输入标题和内容'); return; }
            const body = { title, content };
            const catId = document.getElementById('article-category').value;
            if (catId) body.category_id = parseInt(catId);
            const tags = document.getElementById('article-tags').value.trim();
            if (tags) body.tags = tags.split(',').map(t => t.trim()).filter(t => t);
            const res = await fetch('/articles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(body)
            });
            if (res.ok) { alert('发布成功！'); clearForm(); loadArticles(); loadStats(); }
        }
        function clearForm() {
            document.getElementById('article-title').value = '';
            document.getElementById('article-content').value = '';
            document.getElementById('article-category').value = '';
            document.getElementById('article-tags').value = '';
        }
        function editArticle(slug) { window.location.href = `/admin?edit=${slug}`; }
        async function deleteArticle(slug) {
            if (!confirm('确定删除？')) return;
            await fetch(`/articles/${slug}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadArticles(); loadStats();
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('erudit-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.textContent.includes(theme === 'light' ? '浅色' : theme === 'dark' ? '深色' : '赛博')));
        }
        function loadTheme() {
            const saved = localStorage.getItem('erudit-theme') || 'light';
            setTheme(saved);
        }
        function toggleAdminMenu() {
            document.getElementById('admin-menu').classList.toggle('show');
        }
        function showSettings() {
            const menu = document.getElementById('admin-menu');
            menu.innerHTML = `
                <div class="menu-title">站点设置</div>
                <div class="form-group">
                    <label class="form-label">站点名称</label>
                    <input type="text" class="form-input" id="site-name" value="Erudit">
                </div>
                <div class="form-group">
                    <label class="form-label">友情链接</label>
                    <input type="text" class="form-input" id="site-links" value="Hermes Studio, EKKOLearnAI">
                </div>
                <div class="form-group">
                    <label class="form-label">链接 URL</label>
                    <input type="text" class="form-input" id="site-urls" value="https://hermes-studio.ai, https://github.com/EKKOLearnAI">
                </div>
                <button class="btn" onclick="saveSettings()" style="width:100%">保存</button>
                <button class="btn secondary" onclick="location.reload()" style="width:100%;margin-top:8px">返回</button>
            `;
        }
        async function saveSettings() {
            const name = document.getElementById('site-name').value.trim();
            const links = document.getElementById('site-links').value.trim();
            const urls = document.getElementById('site-urls').value.trim();
            localStorage.setItem('erudit-settings', JSON.stringify({ name, links, urls }));
            alert('设置已保存！');
            location.reload();
        }
    </script>
</body>
</html>
