services:
  knowledge-base:
    build: .
    container_name: knowledge-base
    ports:
      - "8080:8000"
    volumes:
      - kb_data:/data
      - kb_articles:/articles
      - kb_backups:/data/backups
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - KB_DB_PATH=/data/knowledge_base.db
      - KB_ARTICLES_DIR=/articles
    restart: unless-stopped
    networks:
      - kb-network

  # 可选：Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: kb-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - knowledge-base
    restart: unless-stopped
    networks:
      - kb-network

volumes:
  kb_data:
  kb_articles:
  kb_backups:

networks:
  kb-network:
    driver: bridge
